name: Deploy Melofy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual trigger'

permissions:
  contents: read

jobs:
  deploy:
    name: Connect Tailscale & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add the Tailscale machine to known_hosts to prevent MITM warnings / interactive prompts
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Execute Deploy Script on Home Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Starting SSH connection to $SSH_HOST..."
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "cd ~ && ./melofy-deploy.sh"
