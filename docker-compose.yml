services:
  # --- Melofy Backend (API) ---
  api:
    container_name: melofy-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Lavalink config
      LAVALINK_HOST: ${LAVALINK_HOST:-localhost}
      LAVALINK_PORT: ${LAVALINK_PORT:-2333}
      LAVALINK_NAME: ${LAVALINK_NAME:-melofy}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_SECURE: ${LAVALINK_SECURE:-false}
      # API Config
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STREAM_TICKET_SECRET: ${STREAM_TICKET_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://melofy.jene.in}
      # External APIs
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      # Firebase Service Account
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    networks:
      - nodelink_default
    restart: unless-stopped
    volumes:
      - ./serviceAccountKey.json:/run/secrets/firebase-service-account.json:ro

  # --- Melofy Frontend (Web) ---
  web:
    container_name: melofy-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # These vars must be available at build time (Next.js bakes NEXT_PUBLIC_* into the bundle)
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
        UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
        BACKEND_API_URL: ${BACKEND_API_URL:-http://api:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:3001}
      # The web app might also need these at runtime for server actions
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    networks:
      - nodelink_default
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./serviceAccountKey.json:/run/secrets/firebase-service-account.json:ro

networks:
  nodelink_default:
    external: true
